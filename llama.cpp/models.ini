; Model presets for llama-server in router mode (started by run.sh).
;
; Each section is one model the server loads on demand. The section name is
; the model id clients ask for, so it is what goes into DANTE_MODEL_ID.
; Keys are llama-server arguments without the leading dashes, e.g.
; `ctx-size = 32768` for `--ctx-size 32768`. Relative paths are resolved
; from this folder.
; https://github.com/ggml-org/llama.cpp/tree/master/tools/server#model-presets

version = 1

; Defaults for every model below.
[*]
ctx-size = 32768
; Tool calls (MCP) need the model's own chat template.
jinja = on

; https://huggingface.co/LiquidAI/LFM3-1.7B
[lfm3-1.7b]
model = models/LFM3-1.7B-Q8_0.gguf

